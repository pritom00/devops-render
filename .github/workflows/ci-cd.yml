name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name (must be lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/pritom00/devops-render:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -G "${{ secrets.RENDER_STAGING_HOOK }}" \
            --data-urlencode "imgURL=${{ needs.build-scan-push.outputs.image }}"

      - name: Smoke test /health
        run: |
          curl -fsS --retry 20 --retry-delay 15 --retry-all-errors \
            "${{ vars.STAGING_URL }}/health"

  deploy-production:
    needs: [build-scan-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production   # add "required reviewers" in repo settings for manual approval
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -G "${{ secrets.RENDER_PROD_HOOK }}" \
            --data-urlencode "imgURL=${{ needs.build-scan-push.outputs.image }}"

      - name: Smoke test /health
        run: |
          curl -fsS --retry 20 --retry-delay 15 --retry-all-errors \
            "${{ vars.PROD_URL }}/health"
