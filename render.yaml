# Render Blueprint (infrastructure as code).
# Services pull the image built by GitHub Actions from GHCR.
# Replace pritom00/devops-render with your GitHub path (lowercase).
services:
  - type: web
    name: devops-demo-staging
    runtime: image
    image:
      url: ghcr.io/pritom00/devops-render:latest
    plan: free
    healthCheckPath: /health
    autoDeploy: false          # deploys are triggered by the pipeline, not by Render
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: devops-demo-production
    runtime: image
    image:
      url: ghcr.io/pritom00/devops-render:latest
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
